[project]
name = "web-tools-service"
version = "0.1.0"
description = "Web Search, Page-to-Markdown and PDF Extractor Service"
requires-python = ">=3.11"
dependencies = [
	"fastapi>=0.110.0",
	"uvicorn[standard]>=0.28.0",
	"httpx>=0.27.0",
	"trafilatura>=1.8.0",
	"beautifulsoup4>=4.12.0",
	"markdownify>=0.12.1",
	"pypdf>=4.0.0",
	"duckduckgo-search>=6.0.0",
	"python-multipart>=0.0.9",
]
