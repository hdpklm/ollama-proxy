[project]
name = "ollama-priority-proxy"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
	"fastapi",
	"uvicorn",
	"httpx",
	"llama-cpp-python",
]

[tool.uv.sources]
llama-cpp-python = [
	{ url = "https://github.com/hdpklm/ollama-proxy/releases/download/v0.3.36-rpi5/llama_cpp_python-0.3.36-py3-none-linux_aarch64.whl", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
	{ url = "https://github.com/abetlen/llama-cpp-python/releases/download/v0.3.36/llama_cpp_python-0.3.36-py3-none-manylinux2014_x86_64.manylinux_2_17_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
	{ url = "https://github.com/abetlen/llama-cpp-python/releases/download/v0.3.36/llama_cpp_python-0.3.36-py3-none-win_amd64.whl", marker = "sys_platform == 'win32'" },
]
