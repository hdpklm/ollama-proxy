services:
  ollama-proxy:
    build: .
    container_name: ollama-proxy
    command: uv run --no-sync uvicorn main:app --host 0.0.0.0 --port 8000
    network_mode: "host"
    ipc: "host"
    env_file:
      - .env
    volumes:
      - ${OLLAMA_MODELS_DIR:-/usr/share/ollama/.ollama/models/blobs}:/usr/share/ollama/.ollama/models/blobs:ro
      - ./modelos:/app/modelos:ro
    restart: unless-stopped
