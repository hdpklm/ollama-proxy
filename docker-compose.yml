# ==============================================================================
# NOTA DE ARQUITECTURA DE RED Y COMUNICACION INTER-CONTENEDOR:
# ==============================================================================
# Todos los servicios comparten la red interna de Docker 'ollama-net'.
# El DNS interno de Docker resuelve automaticamente los nombres de servicio:
#   - LLM Proxy:  http://ollama-proxy:8000
#   - TTS Piper:  http://piper-tts:5000
#   - STT Vosk:   http://vosk-stt:2700  (o ws://vosk-stt:2700)
#   - Web UI:     http://interface:8080
#
# Para acceder desde fuera del servidor (navegador web o scripts remotos),
# los puertos 8000 y 8080 estan mapeados directamente al host.
# ==============================================================================

services:
  ollama-proxy:
    # build: .
    image: ollama-proxy:latest
    pull_policy: never
    container_name: ollama-proxy
    command: uv run --no-sync uvicorn main:app --host 0.0.0.0 --port 8000
    ipc: "host"
    networks:
      - ollama-net
    ports:
      - "0.0.0.0:8000:8000"
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
      - ./main.py:/app/main.py
      - ${OLLAMA_MODELS_DIR:-/usr/share/ollama/.ollama/models/blobs}:/usr/share/ollama/.ollama/models/blobs:ro
      - ./modelos:/app/modelos:ro
      - ${UV_CACHE_DIR:-${HOME:-/root}/.cache/uv}:/root/.cache/uv
    restart: unless-stopped

  interface:
    # build:
    #   context: ./interface
    #   dockerfile: Dockerfile
    image: interface:latest
    pull_policy: never
    container_name: interface
    networks:
      - ollama-net
    ports:
      - "0.0.0.0:8080:8080"
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    env_file:
      - path: .env
        required: false
      - path: ./interface/.env
        required: false
    environment:
      - PORT=8080
      - LLM_URL=http://ollama-proxy:8000
      - TTS_URL=http://piper-tts:5000
      - STT_URL=http://vosk-stt:2700
      - API_KEY=${PROXY_API_KEY:-cambia_esta_clave}
      - PROXY_API_KEY=${PROXY_API_KEY:-cambia_esta_clave}
      - WEB_TOOLS_URL=http://web-tools:7000
      - REDIS_URL=redis://redis:6379/0
      - PARALLEL_API_KEY=${PARALLEL_API_KEY:-}
      - UV_CACHE_DIR=/root/.cache/uv
    volumes:
      - ./interface/backend/routes:/app/routes
      - ./interface/backend/services:/app/services
      - ./interface/backend/main.py:/app/main.py
      - ./interface/backend/config.py:/app/config.py
      - ./interface/frontend/dist:/app/frontend/dist
      - ${UV_CACHE_DIR:-${HOME:-/root}/.cache/uv}:/root/.cache/uv
    restart: unless-stopped

  piper-tts:
    # build:
    #   context: ./dockers/piper
    #   dockerfile: Dockerfile
    image: piper-tts:latest
    pull_policy: never
    container_name: piper-tts
    networks:
      - ollama-net
    ports:
      - "0.0.0.0:5000:5000"
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    environment:
      - MODELS_DIR=/app/modelos
      - VOICE_NAME=es_ES-sharvard-medium
      - UV_CACHE_DIR=/root/.cache/uv
    volumes:
      - ./dockers/piper/main.py:/app/main.py
      - ./modelos/piper:/app/modelos
      - ${UV_CACHE_DIR:-${HOME:-/root}/.cache/uv}:/root/.cache/uv
    restart: unless-stopped

  vosk-stt:
    # build:
    #   context: ./dockers/vosk
    #   dockerfile: Dockerfile
    image: vosk-stt:latest
    pull_policy: never
    container_name: vosk-stt
    networks:
      - ollama-net
    ports:
      - "0.0.0.0:2700:2700"
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    environment:
      - MODELS_DIR=/app/modelos
      - UV_CACHE_DIR=/root/.cache/uv
    volumes:
      - ./dockers/vosk/main.py:/app/main.py
      - ./modelos/vosk:/app/modelos
      - ${UV_CACHE_DIR:-${HOME:-/root}/.cache/uv}:/root/.cache/uv
    restart: unless-stopped

  web-tools:
    # build:
    #   context: ./dockers/web-tools
    #   dockerfile: Dockerfile
    image: web-tools:latest
    pull_policy: never
    container_name: web-tools
    networks:
      - ollama-net
    ports:
      - "0.0.0.0:7000:7000"
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    environment:
      - PORT=7000
      - PARALLEL_API_KEY=${PARALLEL_API_KEY:-}
      - UV_CACHE_DIR=/root/.cache/uv
    volumes:
      - ./dockers/web-tools/main.py:/app/main.py
      - ${UV_CACHE_DIR:-${HOME:-/root}/.cache/uv}:/root/.cache/uv
    restart: unless-stopped

  redis:
    image: redis/redis-stack-server:latest
    container_name: redis
    restart: unless-stopped
    networks:
      - ollama-net
    ports:
      - "0.0.0.0:6379:6379"
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    volumes:
      - /docker/storage/redis:/data

networks:
  ollama-net:
    name: ollama-net
    driver: bridge
    enable_ipv6: false
